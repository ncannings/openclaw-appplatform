# OpenClaw Backup Configuration
# Users can override via RESTIC_BACKUP_CONFIG_FILE env var

# Restic repository location (S3-compatible)
# Environment variables are expanded at runtime
repository: "s3:${RESTIC_SPACES_ENDPOINT}/${RESTIC_SPACES_BUCKET}/${RESTIC_HOST}/restic"
# Backup paths with per-path exclusions
# Order matters for restore: /etc is restored first after packages
paths:
  - path: /etc
    exclude:
      - "cont-init.d"
      - "services.d"
      - "s6-overlay"

  - path: /root
    exclude:
      - "*.lock"
      - "*.pid"
      - "*.sock"
  - path: /data/.openclaw
    exclude:
      - "*.lock"
      - "*.pid"
      - "*.sock"

  # Must be backed up alongside /data/.openclaw. OpenClaw records workspace
  # attestations under .openclaw, so restoring those without the workspace they
  # attest to leaves the gateway refusing to start:
  #   WorkspaceVanishedError: workspace appears to have disappeared after a
  #   recent initialization: /data/workspace
  - path: /data/workspace
    exclude:
      - "*.lock"
      - "*.pid"
      - "*.sock"

  - path: /data/tailscale

  - path: /home
    exclude:
      - "*.lock"
      - "*.pid"
      - "*.sock"
      # The whole pnpm tree is managed by the Docker image
      # (pnpm add -g openclaw@VERSION), so none of it may be restored.
      #
      # Excluding only global/ and store/ is not enough: the launcher shim at
      # .local/share/pnpm/openclaw hardcodes a content-hashed path into global/,
      # e.g. global/v11/191d-19faeebf5bb-43c0a39f6cf49122/node_modules/openclaw/
      # openclaw.mjs. Restoring that shim over a newer image points it at a hash
      # that no longer exists, and the gateway crash-loops on:
      #   Error: Cannot find module '.../openclaw.mjs'  MODULE_NOT_FOUND
      # This bites on any OPENCLAW_VERSION bump with persistence enabled.
      - ".local/share/pnpm"

# Global settings
backup_interval_seconds: 30 # 30 seconds
prune_interval_seconds: 3600 # 1 hour

# Retention policy (for restic forget)
retention:
  keep_last: 10
  keep_hourly: 48
  keep_daily: 30
  keep_weekly: 8
  keep_monthly: 6
